<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;

        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center; /*ALHINHAMENTO HORIZONTAL*/
            vertical-align: bottom;
        }
        
        .linha{
            background-color: lightgray;
        }

        .dados{
            background-color: rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>

    <!-- HIRARQUIA DE TABELAS SIMPLES
    TABLE = tabela
        TABLE ROWS = linhas de tabelas
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela -->
    <table>
        <tr> <!-- PRIMEIRA LINHA -->
                <td>a1</td>
                <td>b1</td>
                <td>c1</td>
        </tr>
        <tr class="linha"> <!-- SEGUNDA LINHA -->
            <td>a2</td>
            <td>b2</td>
            <td>c2</td>
        </tr>
        <tr> <!-- TERCEIRA LINHA -->
            <td>a3</td>
            <td class="dados">b3</td>
            <td>c3</td>
        </tr>
        <tr> <!-- QUARTA LINHA -->
            <td>a4</td>
            <td>b4</td>
            <td>c4</td>
        </tr>
    </table>
</body>
</html>
