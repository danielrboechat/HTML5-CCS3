<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        /* DECLARAÇÕES GERAIS */
        *{
            margin: 0%;
            padding: 0%;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,body{
            width: 100vh;
            height: 100vh;
            background-color: rgb(38, 0, 255);
            background-repeat: no-repeat;
            background-size: contain;
        }

        h1{
            color: white;
            text-shadow: 2px 2px 0px rgb(20, 0, 133);
            padding: 10px;
        }
        /* DECLARAÇÕES RETRATO */
        @media screen and (orientation: portrait){
        body{
            background-image: url(../pacote-imagens-cap25/imagens/cev-portrait.jpg);
            background-position: center bottom;  
                }     
        }

        /* DECLARAÇÕES PAISAGEM */
        @media screen and (orientation: landscape){
        body{
            background-image: url(../pacote-imagens-cap25/imagens/cev-landscape.jpg);
            background-position: left bottom;
            }
        }
    </style>
</head>
<body>
    <h1>Mude a orientação do seu celular</h1>
</body>
</html>
