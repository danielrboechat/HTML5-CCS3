<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <p>
            <label for="icor">Cor: </label><input type="color" name="color" id="icor"> <br>
            <label for="isat">Nível de satisfação: </label>
            <input type="range" name="sat" id="isat" min="0" max="5" value="4">
        </p>
        <p>
            <label for="ifoto">Foto do perfil: </label><input type="file" name="foto" id="ifoto">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    
</body>
</html>
