<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <p>
        <label for="inome">Nome: </label><input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome Completo" autocomplete="name">
        <p><label for="imedia">Média: </label><input type="number" name="media" id="imdeia" placeholder="Digite sua média" min="0" max="10" step="0.1" value="5"></p>
    </p>
    <p>
        <label for="imes">Período letivo: </label><input type="month" name="mes" id="imes" value="2025-12">
        <p>
            <label for="idate">Data:</label> <input type="date" name="date" id="idate" value="2025-12-13">
        </p>
    </p>
    <p>
        <label for="itime">Horário: </label><input type="time" name="time" id="itime">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
