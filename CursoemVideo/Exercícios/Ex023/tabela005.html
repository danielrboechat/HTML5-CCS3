<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
            body{
                font: 1em sans-serif;
            }
            table{
                width: 400px;
                height: 100px;
                border-collapse: collapse;
                border: 2px solid black;
            }
            th,td{
                border: 1px solid black;
                text-align: center;
                padding: 10px;
            }
            caption{
                border-top: 2px solid black;
                border-left: 2px solid black;
                border-right: 2px solid black;
                text-align: center;
                padding: 5px;
                font-weight: bolder;
                font-size: 1.35rem;
            }
            .coluna-3{
                background-color: aqua;
            }
    </style>
</head>
<body>
